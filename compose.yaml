services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot-state:/app/data
      - ./messages:/app/messages:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  bot-state:
