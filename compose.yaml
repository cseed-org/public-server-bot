services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    cpus: "${BOT_CPUS:-0.5}"
    mem_limit: "${BOT_MEMORY_LIMIT:-256m}"
    # Match the RAM limit to disable container swap and avoid SD-card thrashing.
    memswap_limit: "${BOT_MEMORY_LIMIT:-256m}"
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
    volumes:
      - bot-state:/app/data
      - ./messages:/app/messages:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  bot-state:
